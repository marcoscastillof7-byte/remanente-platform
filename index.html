<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remanente Platform — Estudio Bíblico</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      /* Fuerza bruta CSS para cualquier contenedor conocido de Netlify */
      #netlify-badge, .netlify-badge, netlify-badge, a[href^="https://www.netlify.com"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // Destrucción mediante JavaScript (Observer para cuando Netlify lo inyecte)
      const observer = new MutationObserver(() => {
        const badge1 = document.querySelector('#netlify-badge');
        const badge2 = document.querySelector('.netlify-badge');
        const badge3 = document.querySelector('netlify-badge');
        const badge4 = document.querySelector('a[href*="netlify.com"]');
        
        if (badge1) badge1.remove();
        if (badge2) badge2.remove();
        if (badge3) badge3.remove();
        if (badge4 && badge4.innerHTML.includes('Netlify')) badge4.remove();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
