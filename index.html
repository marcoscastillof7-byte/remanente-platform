<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remanente Platform — Estudio Bíblico</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      /* Fuerza bruta CSS para cualquier contenedor conocido de Netlify */
      #netlify-badge, .netlify-badge, netlify-badge, a[href^="https://www.netlify.com"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // Destrucción total: se ejecuta cada 100ms durante los primeros 10 segundos
      const killBadge = () => {
        // 1. Matar por etiqueta personalizada o IDs clásicos
        const targets = document.querySelectorAll('#netlify-badge, .netlify-badge, netlify-badge');
        targets.forEach(t => t.remove());

        // 2. Matar por URL (busca cualquier enlace hacia netlify.com)
        document.querySelectorAll('a').forEach(a => {
          if (a.href && a.href.toLowerCase().includes('netlify.com')) {
            a.remove();
          }
        });
      };

      killBadge();
      const interval = setInterval(killBadge, 100);
      setTimeout(() => clearInterval(interval), 15000); // Detener a los 15 segundos
    </script>
  </body>
</html>
