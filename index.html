<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remanente Platform — Estudio Bíblico</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remanente" />
    <!-- Preconnect y DNS-Prefetch para acelerar conexión y fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://ltrudmbtqtgonfjctmsz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ltrudmbtqtgonfjctmsz.supabase.co" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      #netlify-badge, .netlify-badge, netlify-badge, a[href^="https://www.netlify.com"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // Eliminación reactiva sin sobrecarga de CPU (MutationObserver)
      const killBadge = () => {
        document.querySelectorAll('#netlify-badge, .netlify-badge, netlify-badge').forEach(t => t.remove());
        document.querySelectorAll('a').forEach(a => {
          if (a.href && a.href.toLowerCase().includes('netlify.com')) a.remove();
        });
      };
      killBadge();
      const observer = new MutationObserver(killBadge);
      observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      setTimeout(() => observer.disconnect(), 10000);
    </script>
  </body>
</html>
